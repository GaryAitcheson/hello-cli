name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # MT5 runs on Windows, and mt5clean does its own encoding, newline
          # and delimiter handling, so one Windows job guards the paths where
          # those actually differ.
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  gui:
    name: GUI tests (xvfb)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tk and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Install
        run: pip install -e ".[dev]"

      - name: Confirm Tk is present
        # The GUI tests skip themselves without a display, and a silently
        # skipped suite is worse than no suite. Fail loudly instead.
        run: |
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Run GUI tests
        run: xvfb-run -a pytest tests/test_gui.py -q

      - name: Fail if the GUI tests skipped
        run: |
          xvfb-run -a pytest tests/test_gui.py -q --no-header -rs > gui.log 2>&1 || true
          if grep -q "skipped" gui.log; then
            echo "::error::GUI tests skipped - Tk or display missing in CI"
            cat gui.log
            exit 1
          fi

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e .

      - name: Format detection
        run: mt5clean info samples/EURUSD_M1_dirty.csv

      - name: Audit finds the planted defects
        run: |
          mt5clean audit samples/EURUSD_M1_dirty.csv \
            --examples 0 --json-out audit.json --gaps-csv gaps.csv
          python - <<'PY'
          import json, sys

          report = json.load(open("audit.json"))
          counts = report["counts"]
          expected = {
              "duplicate_identical": 1,
              "duplicate_conflicting": 1,
              "ohlc_invalid": 1,
              "out_of_order": 1,
              "off_grid": 1,
              "negative_spread": 1,
              "price_spike": 1,
              "zero_volume": 12,
              "gap_intraday": 1,
              "gap_holiday": 1,
          }
          bad = {k: (v, counts.get(k)) for k, v in expected.items() if counts.get(k) != v}
          if bad:
              sys.exit(f"audit missed planted defects (want, got): {bad}")
          if not report["session"]["inferred"]:
              sys.exit("session should have been inferred from 4 weeks of data")
          print(f"audit OK - {report['coverage']['percent']}% session coverage")
          PY

      - name: Dirty file exits non-zero under --fail-on error
        run: |
          if mt5clean audit samples/EURUSD_M1_dirty.csv \
               --examples 0 --fail-on error > /dev/null; then
            echo "::error::expected exit 1 on a file with error-level findings"
            exit 1
          fi

      - name: Repairs clear every error, and the output re-parses
        run: |
          mt5clean clean samples/EURUSD_M1_dirty.csv -o cleaned.csv \
            --examples 0 --dedupe last --sort --fix-ohlc --off-grid snap --drop-spikes
          mt5clean audit cleaned.csv --examples 0 --fail-on error

  windows-exe:
    name: Windows .exe (PyInstaller)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Confirm Tk is present before building
        # The windowed build is useless without tkinter, and PyInstaller only
        # warns about a hidden import it cannot find. Fail here instead of
        # shipping a GUI .exe that dies on launch.
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Build
        run: pyinstaller tools/mt5clean.spec --noconfirm

      - name: Both executables exist
        shell: pwsh
        run: |
          foreach ($exe in "dist/mt5clean.exe", "dist/mt5clean-gui.exe") {
            if (-not (Test-Path $exe)) { throw "$exe was not produced" }
            "{0}  {1:N1} MB" -f $exe, ((Get-Item $exe).Length / 1MB)
          }

      - name: The .exe runs and detects the format
        run: |
          dist\mt5clean.exe --help
          dist\mt5clean.exe info samples\EURUSD_M1_dirty.csv

      - name: The .exe finds the planted defects
        shell: pwsh
        run: |
          dist\mt5clean.exe audit samples\EURUSD_M1_dirty.csv --examples 0 --json-out audit.json
          $report = Get-Content audit.json | ConvertFrom-Json
          if ($report.timeframe -ne "M1") { throw "expected M1, got $($report.timeframe)" }
          if ($report.counts.ohlc_invalid -ne 1) { throw "planted OHLC defect not found" }
          "audit OK - $($report.coverage.percent)% coverage"

      - name: A dirty file still exits non-zero
        shell: pwsh
        run: |
          dist\mt5clean.exe audit samples\EURUSD_M1_dirty.csv --examples 0 --fail-on error
          $code = $LASTEXITCODE
          if ($code -eq 0) { throw "expected a non-zero exit on error-level findings" }
          "exited $code as expected"
          # Reset, or the pwsh wrapper propagates the deliberate failure.
          exit 0

      - name: The .exe repairs a file, and the result re-audits clean
        run: |
          dist\mt5clean.exe clean samples\EURUSD_M1_dirty.csv -o cleaned.csv --examples 0 --dedupe last --sort --fix-ohlc --off-grid snap --drop-spikes
          dist\mt5clean.exe audit cleaned.csv --examples 0 --fail-on error

      - uses: actions/upload-artifact@v4
        with:
          name: mt5clean-windows-exe
          path: |
            dist/mt5clean.exe
            dist/mt5clean-gui.exe
          if-no-files-found: error
