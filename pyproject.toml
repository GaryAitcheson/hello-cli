[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-cli"
version = "0.1.0"
description = "A simple greeter, plus mt5clean: a MetaTrader 5 export checker and repairer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
mt5clean = "mt5clean.cli:main"

[tool.setuptools]
packages = ["mt5clean"]
py-modules = ["hello"]
