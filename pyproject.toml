[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-cli"
version = "0.1.0"
description = "A simple greeter, plus mt5clean: an auditor and repair tool for MetaTrader 5 M1 bar exports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hello = "hello:main"
mt5clean = "mt5clean.cli:main"

[tool.setuptools]
py-modules = ["hello"]

[tool.setuptools.packages.find]
include = ["mt5clean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
